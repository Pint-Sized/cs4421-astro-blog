version: 2
updates:
  # Group routine npm patch and minor updates into a weekly pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # Keep GitHub Actions dependencies updated on the same weekly cadence.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
